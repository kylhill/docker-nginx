---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - patches/**
      - scripts/**
      - tests/**
      - examples/**
      - .forgejo/workflows/pull-request.yml

concurrency:
  group: docker-nginx-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-build
    container:
      # renovate: datasource=node-version depName=node
      image: docker.io/library/node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILDX_BUILDER: pr-${{ forgejo.run_id }}
      BUILDX_CONTEXT: pr-context-${{ forgejo.run_id }}

    steps:
      - name: Install job tools
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            docker-cli \
            docker-cli-buildx \
            git \
            openssl \
            python3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Docker context
        id: docker_context
        run: docker context create "${BUILDX_CONTEXT}"

      - name: Create Buildx builder
        id: builder
        run: |
          docker buildx create \
            --name "${BUILDX_BUILDER}" \
            --driver docker-container \
            --use \
            "${BUILDX_CONTEXT}"

      - name: Build amd64
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}')"
          case "${daemon_arch}" in
            arm64 | aarch64) ;;
            *)
              echo "oci-build must provide a native arm64 Docker daemon; found ${daemon_arch}." >&2
              exit 1
              ;;
          esac

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --output type=cacheonly \
            .

      - name: Build and test arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --load \
            --tag docker-nginx:test-arm64 \
            .

          IMAGE=docker-nginx:test-arm64 \
          PLATFORM=linux/arm64 \
          SKIP_BUILD=1 \
            scripts/verify-image.sh

      - name: Run integration tests
        env:
          IMAGE: docker-nginx:test-arm64
        run: scripts/verify-integration.sh

      - name: Remove Buildx builder
        if: always() && steps.builder.outcome == 'success'
        run: docker buildx rm "${BUILDX_BUILDER}"

      - name: Remove Docker context
        if: always() && steps.docker_context.outcome == 'success'
        run: docker context rm "${BUILDX_CONTEXT}"
