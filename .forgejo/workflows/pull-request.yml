---
name: Pull request validation

"on":
  pull_request:
    branches:
      - main

concurrency:
  group: docker-nginx-pr-${{ forgejo.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - name: Install job tools
        shell: sh
        run: apk add --no-cache bash git python3 shellcheck

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run offline checks
        run: scripts/verify-static.sh

      - name: Select image checks
        id: changes
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
          HEAD_SHA: ${{ forgejo.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
              Dockerfile .dockerignore .forgejo/buildkitd.toml patches scripts tests examples \
              .forgejo/workflows/pull-request.yml .forgejo/workflows/docker-publish.yml \
              .github/workflows/docker-publish.yml; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [[ "$result" != 1 ]]; then exit "$result"; fi
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and integration tests
    needs: static
    if: needs.static.outputs.build == 'true'
    runs-on: oci-build
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILDX_BUILDER: docker-nginx-pr
      BUILDX_CONTEXT: pr-context-${{ forgejo.run_id }}
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

    steps:
      - name: Install job tools
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            docker-cli \
            docker-cli-buildx \
            git \
            openssl \
            python3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Docker context
        id: docker_context
        run: docker context create "${BUILDX_CONTEXT}"

      - name: Create Buildx builder
        id: builder
        run: |
          docker buildx create \
            --name "${BUILDX_BUILDER}" \
            --node "${BUILDX_BUILDER}0" \
            --driver docker-container \
            --buildkitd-config .forgejo/buildkitd.toml \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use \
            "${BUILDX_CONTEXT}"

      - name: Build amd64
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}')"
          case "${daemon_arch}" in
            arm64 | aarch64) ;;
            *)
              echo "oci-build must provide a native arm64 Docker daemon; found ${daemon_arch}." >&2
              exit 1
              ;;
          esac

          docker buildx build --platform linux/amd64 --pull --output type=cacheonly .

      - name: Build and test arm64
        run: |
          docker buildx build --platform linux/arm64 --pull \
            --load --tag docker-nginx:test-arm64 .

          IMAGE=docker-nginx:test-arm64 \
            scripts/verify-integration.sh

      - name: Remove Buildx builder
        if: always() && steps.builder.outcome == 'success'
        run: docker buildx rm --keep-state "${BUILDX_BUILDER}"

      - name: Remove Docker context
        if: always() && steps.docker_context.outcome == 'success'
        run: docker context rm "${BUILDX_CONTEXT}"

  renovate-config:
    name: Configuration
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: oci-deps
    timeout-minutes: 10
    container:
      image: docker.io/renovate/renovate:44.198.2@sha256:4132c8c1b0051ade1429c2e5f439569b361b4527216a1c184ff4ba58a2d1fd7e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Renovate configuration
        run: renovate-config-validator --strict --no-global renovate.json
