---
name: Maintenance

"on":
  schedule:
    - cron: "32 9 * * 5"
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: maintenance-${{ forgejo.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    name: Update dependencies
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 60
    container:
      image: docker.io/renovate/renovate:44.198.0@sha256:9ace7c60234605b242fa7edf44f77a70a17f3b0e963e8e969bd59341a5b4295d
      volumes:
        - /opt/cache/renovate:/tmp/renovate/cache
    env:
      LOG_LEVEL: info
      RENOVATE_CACHE_DIR: /tmp/renovate/cache
      RENOVATE_ENDPOINT: https://git.tacomafia.net/api/v1
      RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.RENOVATE_GITHUB_COM_TOKEN }}
      RENOVATE_HOST_RULES: '[{"hostType":"forgejo","matchHost":"https://git.tacomafia.net/","allowInternal":true}]'
      RENOVATE_INTERNAL_HOST_ACCESS: block
      RENOVATE_ONBOARDING: "false"
      RENOVATE_PLATFORM: forgejo
      RENOVATE_REPOSITORY_CACHE: enabled
      RENOVATE_REPOSITORIES: kylhill/docker-nginx
      RENOVATE_REQUIRE_CONFIG: required
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Update dependencies
        run: renovate

  validate:
    name: Weekly validation
    if: forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch'
    runs-on: oci-deps
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Install job tools
        shell: sh
        run: apk add --no-cache bash git python3 shellcheck

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run offline checks
        run: scripts/verify-static.sh
