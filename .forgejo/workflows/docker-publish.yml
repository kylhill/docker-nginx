---
name: Build and Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .forgejo/buildkitd.toml
      - patches/**
      - scripts/**
      - tests/**
      - examples/**
      - .forgejo/workflows/docker-publish.yml
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: docker-nginx-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: oci-build
    container:
      # renovate: datasource=node-version depName=node
      image: docker.io/library/node:24-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILDX_BUILDER: docker-nginx-publish
      BUILDX_CONTEXT: ci-context-${{ forgejo.run_id }}
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # renovate: datasource=docker depName=docker/buildkit-syft-scanner
      SYFT_SCANNER_IMAGE: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

    steps:
      - name: Install job tools
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            docker-cli \
            docker-cli-buildx \
            git \
            openssl \
            python3 \
            shellcheck

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check scripts and retention logic
        run: scripts/verify-static.sh

      - name: Create Docker context
        id: docker_context
        run: docker context create "${BUILDX_CONTEXT}"

      - name: Create Buildx builder
        id: builder
        run: |
          docker buildx create \
            --name "${BUILDX_BUILDER}" \
            --node "${BUILDX_BUILDER}0" \
            --driver docker-container \
            --buildkitd-config .forgejo/buildkitd.toml \
            --driver-opt "image=${BUILDKIT_IMAGE}" \
            --use \
            "${BUILDX_CONTEXT}"

      - name: Log in to Forgejo registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ forgejo.repository_owner }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" |
            docker login git.tacomafia.net \
              --username "${REGISTRY_USERNAME}" \
              --password-stdin

      - name: Set image metadata
        run: |
          echo "IMAGE=${FORGEJO_SERVER_URL#*://}/${FORGEJO_REPOSITORY,,}" >> "${FORGEJO_ENV}"
          echo "SHORT_SHA=${FORGEJO_SHA:0:12}" >> "${FORGEJO_ENV}"

      - name: Build amd64
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}')"
          case "${daemon_arch}" in
            arm64 | aarch64) ;;
            *)
              echo "oci-build must provide a native arm64 Docker daemon; found ${daemon_arch}." >&2
              exit 1
              ;;
          esac

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --provenance=mode=max \
            --sbom="generator=${SYFT_SCANNER_IMAGE}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-amd64" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/amd64-metadata.json \
            .

          digest="$(python3 -c 'import json; print(json.load(open("/tmp/amd64-metadata.json"))["containerimage.digest"])')"
          echo "AMD64_DIGEST=${digest}" >> "${FORGEJO_ENV}"

          # Forgejo can reject concurrent image and cache uploads when both
          # exporters try to commit the same new blob. Export the cache only
          # after the image's content-addressed manifest has been pushed.
          docker buildx build \
            --platform linux/amd64 \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-amd64" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-amd64,mode=max,image-manifest=true,oci-mediatypes=true" \
            .

      - name: Build and test arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --provenance=mode=max \
            --sbom="generator=${SYFT_SCANNER_IMAGE}" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-arm64" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/arm64-metadata.json \
            .

          digest="$(python3 -c 'import json; print(json.load(open("/tmp/arm64-metadata.json"))["containerimage.digest"])')"
          echo "ARM64_DIGEST=${digest}" >> "${FORGEJO_ENV}"

          docker buildx build \
            --platform linux/arm64 \
            --cache-from "type=registry,ref=${IMAGE}:buildcache-arm64" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true" \
            .

          docker pull "${IMAGE}@${digest}"
          docker tag "${IMAGE}@${digest}" docker-nginx:test-arm64

          IMAGE=docker-nginx:test-arm64 \
          PLATFORM=linux/arm64 \
          SKIP_BUILD=1 \
          TEST_CASES=contract,enabled,nonroot \
            scripts/verify-image.sh

      - name: Publish multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Retain newest 10 SHA releases
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          API_URL: https://git.tacomafia.net/api/v1
          REPOSITORY: ${{ forgejo.repository }}
        run: python3 scripts/cleanup-forgejo-packages.py

      - name: Log out
        if: always()
        run: docker logout git.tacomafia.net

      - name: Remove Buildx builder
        if: always() && steps.builder.outcome == 'success'
        run: docker buildx rm --keep-state "${BUILDX_BUILDER}"

      - name: Remove Docker context
        if: always() && steps.docker_context.outcome == 'success'
        run: docker context rm "${BUILDX_CONTEXT}"
