---
name: Build and Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - patches/**
      - scripts/**
      - tests/**
      - examples/**
      - .forgejo/workflows/docker-publish.yml
  workflow_dispatch:

enable-email-notifications: true

concurrency:
  group: docker-nginx-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: oci-build
    container:
      # renovate: datasource=node-version depName=node
      image: docker.io/library/node:24-alpine@sha256:50c8e8ca1d27439048670df5883f32d57cf81cff6233222c893fd0d9884cbd81
      volumes:
        - /opt/cache:/var/cache/docker-nginx-build
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BUILDX_BUILDER: ci-${{ forgejo.run_id }}
      BUILDX_CONTEXT: ci-context-${{ forgejo.run_id }}
      CACHE_SCOPE: publish

    steps:
      - name: Install job tools
        shell: sh
        run: |
          apk add --no-cache \
            bash \
            docker-cli \
            docker-cli-buildx \
            git \
            openssl \
            python3

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Docker context
        id: docker_context
        run: docker context create "${BUILDX_CONTEXT}"

      - name: Create Buildx builder
        id: builder
        run: |
          docker buildx create \
            --name "${BUILDX_BUILDER}" \
            --driver docker-container \
            --use \
            "${BUILDX_CONTEXT}"

      - name: Log in to Forgejo registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ forgejo.repository_owner }}
        run: |
          printf '%s' "${REGISTRY_TOKEN}" |
            docker login git.tacomafia.net \
              --username "${REGISTRY_USERNAME}" \
              --password-stdin

      - name: Set image metadata
        run: |
          echo "IMAGE=${FORGEJO_SERVER_URL#*://}/${FORGEJO_REPOSITORY,,}" >> "${FORGEJO_ENV}"
          echo "SHORT_SHA=${FORGEJO_SHA:0:12}" >> "${FORGEJO_ENV}"

      - name: Build amd64
        run: |
          daemon_arch="$(docker info --format '{{.Architecture}}')"
          case "${daemon_arch}" in
            arm64 | aarch64) ;;
            *)
              echo "oci-build must provide a native arm64 Docker daemon; found ${daemon_arch}." >&2
              exit 1
              ;;
          esac

          cache_from=()
          cache_dir="/var/cache/docker-nginx-build/${CACHE_SCOPE}-amd64"
          if [[ -f "${cache_dir}/index.json" ]]; then
            cache_from=(--cache-from "type=local,src=${cache_dir}")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            "${cache_from[@]}" \
            --cache-to "type=local,dest=${cache_dir},mode=max" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/amd64-metadata.json \
            .

          digest="$(python3 -c 'import json; print(json.load(open("/tmp/amd64-metadata.json"))["containerimage.digest"])')"
          echo "AMD64_DIGEST=${digest}" >> "${FORGEJO_ENV}"

      - name: Build and test arm64
        run: |
          cache_from=()
          cache_dir="/var/cache/docker-nginx-build/${CACHE_SCOPE}-arm64"
          if [[ -f "${cache_dir}/index.json" ]]; then
            cache_from=(--cache-from "type=local,src=${cache_dir}")
          fi

          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            "${cache_from[@]}" \
            --cache-to "type=local,dest=${cache_dir},mode=max" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/arm64-metadata.json \
            .

          digest="$(python3 -c 'import json; print(json.load(open("/tmp/arm64-metadata.json"))["containerimage.digest"])')"
          echo "ARM64_DIGEST=${digest}" >> "${FORGEJO_ENV}"
          docker pull "${IMAGE}@${digest}"
          docker tag "${IMAGE}@${digest}" docker-nginx:test-arm64

          IMAGE=docker-nginx:test-arm64 \
          PLATFORM=linux/arm64 \
          SKIP_BUILD=1 \
            scripts/verify-image.sh

      - name: Run integration tests
        env:
          IMAGE: docker-nginx:test-arm64
        run: scripts/verify-integration.sh

      - name: Publish multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Retain newest 10 SHA releases
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          API_URL: https://git.tacomafia.net/api/v1
          REPOSITORY: ${{ forgejo.repository }}
        run: python3 scripts/cleanup-forgejo-packages.py

      - name: Log out
        if: always()
        run: docker logout git.tacomafia.net

      - name: Remove Buildx builder
        if: always() && steps.builder.outcome == 'success'
        run: docker buildx rm "${BUILDX_BUILDER}"

      - name: Remove Docker context
        if: always() && steps.docker_context.outcome == 'success'
        run: docker context rm "${BUILDX_CONTEXT}"
