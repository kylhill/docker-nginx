lua_package_path '/usr/local/lua/crowdsec/?.lua;/usr/share/lua/common/?.lua;/usr/share/lua/common/?/init.lua;;';
lua_package_cpath '/usr/local/lib/lua/5.1/?.so;;';
lua_shared_dict crowdsec_cache 50m;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

init_by_lua_block {
    local config_path = "/config/crowdsec/crowdsec-nginx-bouncer.conf"
    crowdsec_enabled = true
    cs = require "crowdsec"
    local bouncer_version = require "bouncer_version"
    local ok, err = cs.init(config_path, "crowdsec-nginx-bouncer/v" .. bouncer_version)
    if ok == nil then
        ngx.log(ngx.ERR, "[Crowdsec] " .. err)
        error()
    end
}

map $server_addr $unix {
    default  0;
    "~unix:" 1;
}

access_by_lua_block {
    if ngx.var.unix ~= "1" and ngx.var.addr_allowed ~= "yes" then
        local cs = require "crowdsec"
        cs.Allow(ngx.var.remote_addr)
    end
}

init_worker_by_lua_block {
    local cs = require "crowdsec"
    if string.lower(cs.get_mode()) == "stream" then
        cs.SetupStream()
    end
    if ngx.worker.id() == 0 then
        cs.SetupMetrics()
    end
}
