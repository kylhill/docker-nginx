name: Dependency update report

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-update-report
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  source-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Check source-controlled dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-updates.sh --check --format markdown > "$RUNNER_TEMP/source-dependencies.md"

      - name: Upload source dependency report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report-source
          path: ${{ runner.temp }}/source-dependencies.md
          if-no-files-found: error
          retention-days: 1

  apk-packages:
    name: Compare Alpine packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Compare floating Alpine packages
        env:
          ARCHES: ${{ matrix.arch }}
        run: scripts/compare-apk-packages.sh > "$RUNNER_TEMP/apk-packages-${{ matrix.arch }}.md"

      - name: Upload Alpine package report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-report-apk-${{ matrix.arch }}
          path: ${{ runner.temp }}/apk-packages-${{ matrix.arch }}.md
          if-no-files-found: error
          retention-days: 1

  report:
    needs: [source-dependencies, apk-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download report fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dependency-report-*
          path: ${{ runner.temp }}/report-fragments
          merge-multiple: true

      - name: Build report
        run: |
          set -euo pipefail
          fragments="$RUNNER_TEMP/report-fragments"
          apk_updates=false
          if grep -q '<!-- apk-updates-available:true -->' \
              "${fragments}"/apk-packages-*.md; then
            apk_updates=true
          fi
          {
            echo "<!-- docker-nginx-dependency-report -->"
            echo "Last checked: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            cat "${fragments}/source-dependencies.md"
            echo
            echo "<!-- apk-updates-available:${apk_updates} -->"
            sed '/^<!-- apk-updates-available:/d' \
              "${fragments}/apk-packages-amd64.md"
            echo
            sed -n '/^### `linux\/arm64`/,$p' \
              "${fragments}/apk-packages-arm64.md"
            echo
            echo "Apply every available update locally with:"
            echo '```bash'
            echo 'scripts/check-updates.sh --update'
            echo 'scripts/verify-image.sh'
            echo 'scripts/verify-integration.sh'
            echo '```'
          } > "$RUNNER_TEMP/dependency-report.md"
          cat "$RUNNER_TEMP/dependency-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="Dependency update report"
          marker='<!-- docker-nginx-dependency-report -->'
          mapfile -t issue_numbers < <(gh api --paginate \
            "repos/${GH_REPO}/issues?state=all&per_page=100" \
            --jq ".[] | select(.pull_request == null and
              ((.body // \"\") | contains(\"${marker}\"))) | .number")
          ((${#issue_numbers[@]} <= 1)) || {
            echo "Multiple dependency tracking issues contain ${marker}" >&2
            exit 1
          }
          issue_number="${issue_numbers[0]:-}"

          if grep -q '<!-- updates-available:true -->' "$RUNNER_TEMP/dependency-report.md" ||
              grep -q '<!-- apk-updates-available:true -->' "$RUNNER_TEMP/dependency-report.md"; then
            if [[ -n "${issue_number}" ]]; then
              gh api --method PATCH "repos/${GH_REPO}/issues/${issue_number}" \
                --field state=open \
                --field body=@"$RUNNER_TEMP/dependency-report.md" >/dev/null
            else
              gh api --method POST "repos/${GH_REPO}/issues" \
                --field title="${title}" \
                --field body=@"$RUNNER_TEMP/dependency-report.md" >/dev/null
            fi
          elif [[ -n "${issue_number}" ]]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/${issue_number}" \
              --field state=closed \
              --field body=@"$RUNNER_TEMP/dependency-report.md" >/dev/null
          fi
