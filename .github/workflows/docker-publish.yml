name: Build and Publish Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .hadolint.yaml
      - root/**
      - patches/**
      - scripts/**
      - tests/**
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: docker-nginx-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  BUILDX_VERSION: v0.36.0
  BUILDKIT_IMAGE: moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  HADOLINT_IMAGE: ghcr.io/hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          find root scripts tests -type f -print0 \
            | xargs -0 grep -IlZ '^#!' \
            | sort -z \
            | xargs -0 --no-run-if-empty docker run --rm \
                --network none \
                --read-only \
                --cap-drop ALL \
                --security-opt no-new-privileges=true \
                --volume "$PWD:/repo:ro" \
                --workdir /repo \
                "$SHELLCHECK_IMAGE"

      - name: Hadolint
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            "$HADOLINT_IMAGE" hadolint Dockerfile

      - name: Actionlint
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' workflow_files < <(
            find .github/workflows -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z
          )
          ((${#workflow_files[@]} > 0))
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --volume "$PWD/.github/workflows:/repo/.github/workflows:ro" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" "${workflow_files[@]}"

  verify:
    name: Verify (${{ matrix.arch }})
    needs: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          base_image="${base_ref%@sha256:*}"
          base_digest="sha256:${base_ref##*@sha256:}"
          if [[ "${base_ref}" != *@sha256:* ]] ||
              [[ ! "${base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Dockerfile BASE_IMAGE must be pinned by sha256 digest." >&2
            exit 1
          fi
          {
            echo "base_image=${base_image}"
            echo "base_digest=${base_digest}"
            echo "created=$(git show -s --format=%cI "${GITHUB_SHA}")"
            echo "version=sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-nginx-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=docker-nginx-${{ matrix.arch }},timeout=2m,ignore-error=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.base.name=${{ steps.image.outputs.base_image }}
            org.opencontainers.image.base.digest=${{ steps.image.outputs.base_digest }}

      - name: Load image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          LOCAL_IMAGE: docker-nginx:ci-${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "${IMAGE_NAME}@${DIGEST}"
          docker tag "${IMAGE_NAME}@${DIGEST}" "${LOCAL_IMAGE}"

      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

      - name: Confirm loaded architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker image inspect \
            --format '{{.Architecture}}' \
            docker-nginx:ci-${{ matrix.arch }})"
          test "${actual}" = "${{ matrix.arch }}"

      - name: Run core smoke test
        env:
          IMAGE: docker-nginx:ci-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SKIP_BUILD: "1"
        run: scripts/verify-image.sh

      - name: Run integration tests
        if: matrix.arch == 'amd64'
        env:
          IMAGE: docker-nginx:ci-amd64
        run: scripts/verify-integration.sh

      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload verified digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-and-publish:
    needs: [lint, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          base_digest="sha256:${base_ref##*@sha256:}"
          if [[ "${base_ref}" != *@sha256:* ]] ||
              [[ ! "${base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Dockerfile BASE_IMAGE must be pinned by sha256 digest." >&2
            exit 1
          fi
          {
            echo "base_digest=${base_digest}"
            echo "version=sha-${GITHUB_SHA::12}-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Download verified digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Create and push multi-platform image
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          [[ "${#digest_files[@]}" -eq 2 ]] || {
            echo "Expected two verified platform digests, found ${#digest_files[@]}." >&2
            exit 1
          }

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "${digest_file}")"
            [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
              echo "Invalid verified digest filename: ${digest}" >&2
              exit 1
            }
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          VERSION_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_BASE_DIGEST: ${{ steps.image.outputs.base_digest }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          latest_digest="$(docker buildx imagetools inspect "${IMAGE}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          version_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .Manifest}}' | jq -er '.digest')"
          test "${latest_digest}" = "${EXPECTED_DIGEST}"
          test "${version_digest}" = "${EXPECTED_DIGEST}"

          manifest="$(docker buildx imagetools inspect "${VERSION_IMAGE}")"
          printf '%s\n' "${manifest}"
          grep -q 'Platform:[[:space:]]*linux/amd64' <<<"${manifest}"
          grep -q 'Platform:[[:space:]]*linux/arm64' <<<"${manifest}"

          for platform in linux/amd64 linux/arm64; do
            base_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.base.digest\" }}")"
            version="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.version\" }}")"
            test "${base_digest}" = "${EXPECTED_BASE_DIGEST}"
            test "${version}" = "${EXPECTED_VERSION}"
          done

          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .Provenance}}' > "${RUNNER_TEMP}/provenance.json"
          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .SBOM}}' > "${RUNNER_TEMP}/sbom.json"
          grep -q '"SLSA"' "${RUNNER_TEMP}/provenance.json"
          grep -q '"SPDX"' "${RUNNER_TEMP}/sbom.json"

      - name: Prune GHCR package versions (keep 20)
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-type: container
          package-name: ${{ github.event.repository.name }}
          min-versions-to-keep: 20
          delete-only-untagged-versions: "false"
