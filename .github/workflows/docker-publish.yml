---
name: Build and Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - patches/**
      - scripts/**
      - tests/**
      - examples/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

enable-email-notifications: true
   
concurrency:
  group: docker-nginx-registry
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and test amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --load \
            --tag docker-nginx:test-amd64 \
            .

          IMAGE=docker-nginx:test-amd64 \
          PLATFORM=linux/amd64 \
          SKIP_BUILD=1 \
            scripts/verify-image.sh

      - name: Build arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --load \
            --tag docker-nginx:test-arm64 \
            .

      - name: Run integration tests
        env:
          IMAGE: docker-nginx:test-amd64
        run: scripts/verify-integration.sh

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and publish
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA:0:12}"
          IMAGE="${IMAGE,,}"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --pull \
            --provenance=false \
            --sbom=false \
            --tag "${IMAGE}:sha-${short_sha}" \
            --tag "${IMAGE}:latest" \
            --push \
            .

      - name: Retain newest 10 SHA releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          case "${OWNER_TYPE}" in
            Organization) package_path="orgs/${OWNER}" ;;
            User) package_path="users/${OWNER}" ;;
            *) echo "Unsupported repository owner type: ${OWNER_TYPE}" >&2; exit 1 ;;
          esac
          package_path+="/packages/container/${PACKAGE_NAME}/versions"

          mapfile -t expired_ids < <(
            gh api --paginate --slurp \
              "${package_path}?state=active&per_page=100" |
              jq -r '
                [ .[][]
                  | select(any(.metadata.container.tags[]?;
                      test("^sha-[a-f0-9]{12}$"))) ]
                | sort_by(.created_at, .id) | reverse | .[10:]
                | .[].id
              '
          )

          echo "Deleting ${#expired_ids[@]} SHA releases; retaining the newest 10."
          for version_id in "${expired_ids[@]}"; do
            [[ "${version_id}" =~ ^[0-9]+$ ]]
            gh api --method DELETE "${package_path}/${version_id}"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io
