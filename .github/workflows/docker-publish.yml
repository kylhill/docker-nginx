name: Build and Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-nginx-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.36.0
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2

jobs:
  verify:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-ci.yml

  build-and-publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          base_digest="sha256:${base_ref##*@sha256:}"
          if [[ "${base_ref}" != *@sha256:* ]] ||
              [[ ! "${base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Dockerfile BASE_IMAGE must be pinned by sha256 digest." >&2
            exit 1
          fi
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Download verified digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform image
        id: publish
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "${RUNNER_TEMP}/digests" -maxdepth 1 -type f | sort)
          [[ "${#digest_files[@]}" -eq 2 ]] || {
            echo "Expected two verified platform digests, found ${#digest_files[@]}." >&2
            exit 1
          }

          sources=()
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "${digest_file}")"
            [[ "${digest}" =~ ^[a-f0-9]{64}$ ]] || {
              echo "Invalid verified digest filename: ${digest}" >&2
              exit 1
            }
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${VERSION}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          VERSION_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.publish.outputs.digest }}
          EXPECTED_BASE_DIGEST: ${{ steps.image.outputs.base_digest }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          latest_digest="$(docker buildx imagetools inspect "${IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          version_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          test "${latest_digest}" = "${EXPECTED_DIGEST}"
          test "${version_digest}" = "${EXPECTED_DIGEST}"

          manifest="$(docker buildx imagetools inspect "${VERSION_IMAGE}")"
          printf '%s\n' "${manifest}"
          grep -q 'Platform:[[:space:]]*linux/amd64' <<<"${manifest}"
          grep -q 'Platform:[[:space:]]*linux/arm64' <<<"${manifest}"

          for platform in linux/amd64 linux/arm64; do
            base_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.base.digest\" }}")"
            version="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.version\" }}")"
            test "${base_digest}" = "${EXPECTED_BASE_DIGEST}"
            test "${version}" = "${EXPECTED_VERSION}"
          done

          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .Provenance}}' > "${RUNNER_TEMP}/provenance.json"
          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .SBOM}}' > "${RUNNER_TEMP}/sbom.json"
          grep -q '"SLSA"' "${RUNNER_TEMP}/provenance.json"
          grep -q '"SPDX"' "${RUNNER_TEMP}/sbom.json"

      - name: Prune GHCR package versions (keep 10)
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-type: container
          package-name: ${{ github.event.repository.name }}
          min-versions-to-keep: 10
          delete-only-untagged-versions: "false"
