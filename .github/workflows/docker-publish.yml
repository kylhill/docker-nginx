---
name: Build and Publish Docker image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - patches/**
      - scripts/**
      - tests/**
      - examples/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

concurrency:
  group: docker-nginx-registry
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # renovate: datasource=docker depName=moby/buildkit
      BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      # renovate: datasource=docker depName=docker/buildkit-syft-scanner
      SYFT_SCANNER_IMAGE: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set image metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: Build amd64
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --provenance=mode=max \
            --sbom="generator=${SYFT_SCANNER_IMAGE}" \
            --cache-from "type=gha,scope=publish-amd64" \
            --cache-to "type=gha,scope=publish-amd64,mode=max" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/amd64-metadata.json \
            .

          digest="$(jq -er '."containerimage.digest"' /tmp/amd64-metadata.json)"
          echo "AMD64_DIGEST=${digest}" >> "${GITHUB_ENV}"
          docker pull "${IMAGE}@${digest}"
          docker tag "${IMAGE}@${digest}" docker-nginx:test-amd64

      - name: Test amd64
        run: |
          IMAGE=docker-nginx:test-amd64 \
          PLATFORM=linux/amd64 \
          SKIP_BUILD=1 \
            scripts/verify-image.sh
          IMAGE=docker-nginx:test-amd64 scripts/verify-integration.sh

      - name: Build arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --pull \
            --provenance=mode=max \
            --sbom="generator=${SYFT_SCANNER_IMAGE}" \
            --cache-from "type=gha,scope=publish-arm64" \
            --cache-to "type=gha,scope=publish-arm64,mode=max" \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/arm64-metadata.json \
            .

          digest="$(jq -er '."containerimage.digest"' /tmp/arm64-metadata.json)"
          echo "ARM64_DIGEST=${digest}" >> "${GITHUB_ENV}"

      - name: Publish multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

      - name: Retain newest 10 SHA releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          case "${OWNER_TYPE}" in
            Organization) package_path="orgs/${OWNER}" ;;
            User) package_path="users/${OWNER}" ;;
            *) echo "Unsupported repository owner type: ${OWNER_TYPE}" >&2; exit 1 ;;
          esac
          package_path+="/packages/container/${PACKAGE_NAME}/versions"

          mapfile -t expired_ids < <(
            gh api --paginate --slurp \
              "${package_path}?state=active&per_page=100" |
              jq -r '
                [ .[][]
                  | select(any(.metadata.container.tags[]?;
                      test("^sha-[a-f0-9]{12}$"))) ]
                | sort_by(.created_at, .id) | reverse | .[10:]
                | .[].id
              '
          )

          echo "Deleting ${#expired_ids[@]} SHA releases; retaining the newest 10."
          for version_id in "${expired_ids[@]}"; do
            [[ "${version_id}" =~ ^[0-9]+$ ]]
            gh api --method DELETE "${package_path}/${version_id}"
          done

      - name: Log out
        if: always()
        run: docker logout ghcr.io
