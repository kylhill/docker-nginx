name: Build and Publish Docker image

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 9 * * 0"
  workflow_dispatch:

concurrency:
  group: docker-nginx-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDX_VERSION: v0.35.0
  BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  QEMU_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    outputs:
      should_publish: ${{ steps.decision.outputs.should_publish }}
      reason: ${{ steps.decision.outputs.reason }}
      base_image: ${{ steps.base.outputs.base_image }}
      base_digest: ${{ steps.base.outputs.base_digest }}

    steps:
      - name: Checkout
        if: github.event_name == 'schedule'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: github.event_name == 'schedule'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Resolve upstream base image digest
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE_IMAGE="ghcr.io/linuxserver/baseimage-alpine:3.24"
          BASE_DIGEST="$(docker buildx imagetools inspect "${BASE_IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"

          if [[ -z "${BASE_DIGEST}" ]]; then
            echo "Failed to determine digest for ${BASE_IMAGE}" >&2
            exit 1
          fi

          echo "base_image=${BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Upstream base digest: ${BASE_DIGEST}"

      - name: Log in to GHCR for scheduled comparison
        if: github.event_name == 'schedule'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to publish
        id: decision
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.base.outputs.base_image }}@${{ steps.base.outputs.base_digest }}
          PUBLISHED_IMAGE: ghcr.io/${{ github.repository }}:latest
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "reason=${{ github.event_name }} event" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          error_file="$(mktemp)"
          if ! docker buildx imagetools inspect "${PUBLISHED_IMAGE}" \
              >/dev/null 2>"${error_file}"; then
            if grep -Eqi 'manifest unknown|name unknown|not found' "${error_file}"; then
              echo "reason=no published latest image" >> "$GITHUB_OUTPUT"
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "${error_file}" >&2
            exit 1
          fi

          changed=false
          for arch in amd64 arm64; do
            platform="linux/${arch}"
            published_tag="docker-nginx:published-${arch}"
            candidate_tag="docker-nginx:candidate-${arch}"

            docker pull --platform "${platform}" "${PUBLISHED_IMAGE}"
            docker tag "${PUBLISHED_IMAGE}" "${published_tag}"

            docker buildx build \
              --platform "${platform}" \
              --pull \
              --no-cache \
              --provenance=false \
              --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
              --tag "${candidate_tag}" \
              --output "type=docker,dest=${RUNNER_TEMP}/candidate-${arch}.tar,rewrite-timestamp=true" \
              .
            docker load --input "${RUNNER_TEMP}/candidate-${arch}.tar"

            published_id="$(scripts/image-content-id.sh "${published_tag}")"
            candidate_id="$(scripts/image-content-id.sh "${candidate_tag}")"

            echo "${arch} published content:"
            echo "${published_id}"
            echo "${arch} candidate content:"
            echo "${candidate_id}"

            if [[ "${published_id}" != "${candidate_id}" ]]; then
              changed=true
              echo "${arch} has meaningful image changes."
            fi
          done

          if [[ "${changed}" == true ]]; then
            echo "reason=scheduled image content changed" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "reason=no meaningful scheduled image changes" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful image changes; verification and publication will be skipped."
          fi

      - name: Write gate summary
        shell: bash
        run: |
          {
            echo "## Publish decision"
            echo
            echo "- Publish: \`${{ steps.decision.outputs.should_publish }}\`"
            echo "- Reason: ${{ steps.decision.outputs.reason }}"
            echo "- Base: \`${{ steps.base.outputs.base_image }}@${{ steps.base.outputs.base_digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-ci.yml
    with:
      base_image: ${{ needs.gate.outputs.base_image }}@${{ needs.gate.outputs.base_digest }}

  build-and-publish:
    needs: [gate, verify]
    if: >-
      ${{ always() &&
          needs.gate.outputs.should_publish == 'true' &&
          needs.verify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true
          pull: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ needs.gate.outputs.base_image }}@${{ needs.gate.outputs.base_digest }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            build_version=docker-nginx version:- ${{ steps.image.outputs.version }} Build-date:- ${{ steps.image.outputs.created }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.ref.name=${{ steps.image.outputs.version }}
            org.opencontainers.image.base.name=${{ needs.gate.outputs.base_image }}
            org.opencontainers.image.base.digest=${{ needs.gate.outputs.base_digest }}

      - name: Verify published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          VERSION_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_BASE_DIGEST: ${{ needs.gate.outputs.base_digest }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          latest_digest="$(docker buildx imagetools inspect "${IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          version_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          test "${latest_digest}" = "${EXPECTED_DIGEST}"
          test "${version_digest}" = "${EXPECTED_DIGEST}"

          manifest="$(docker buildx imagetools inspect "${VERSION_IMAGE}")"
          printf '%s\n' "${manifest}"
          grep -q 'Platform:[[:space:]]*linux/amd64' <<<"${manifest}"
          grep -q 'Platform:[[:space:]]*linux/arm64' <<<"${manifest}"

          for platform in linux/amd64 linux/arm64; do
            base_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.base.digest\" }}")"
            version="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.version\" }}")"
            ref_name="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.ref.name\" }}")"
            vendor="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.vendor\" }}")"
            build_version="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"build_version\" }}")"
            test "${base_digest}" = "${EXPECTED_BASE_DIGEST}"
            test "${version}" = "${EXPECTED_VERSION}"
            test "${ref_name}" = "${EXPECTED_VERSION}"
            test "${vendor}" = "Kyle Hill"
            grep -Fq "docker-nginx version:- ${EXPECTED_VERSION}" <<<"${build_version}"
          done

          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .Provenance}}' > "${RUNNER_TEMP}/provenance.json"
          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .SBOM}}' > "${RUNNER_TEMP}/sbom.json"
          grep -q '"SLSA"' "${RUNNER_TEMP}/provenance.json"
          grep -q '"SPDX"' "${RUNNER_TEMP}/sbom.json"

      - name: Prune GHCR package versions (keep 10)
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-type: container
          package-name: ${{ github.event.repository.name }}
          min-versions-to-keep: 10
          delete-only-untagged-versions: "false"
