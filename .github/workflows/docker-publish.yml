name: Build and Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-nginx-${{ github.ref }}
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.36.0
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
  # renovate: datasource=docker depName=tonistiigi/binfmt
  QEMU_IMAGE: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base_image: ${{ steps.image.outputs.base_image }}
      base_digest: ${{ steps.image.outputs.base_digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned base image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
          base_image="${base_ref%@sha256:*}"
          base_digest="sha256:${base_ref##*@sha256:}"
          if [[ "${base_ref}" != *@sha256:* ]] ||
              [[ ! "${base_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Dockerfile BASE_IMAGE must be pinned by sha256 digest." >&2
            exit 1
          fi
          echo "base_image=${base_image}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"

  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-ci.yml

  build-and-publish:
    needs: [metadata, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.base.name=${{ needs.metadata.outputs.base_image }}
            org.opencontainers.image.base.digest=${{ needs.metadata.outputs.base_digest }}

      - name: Verify published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          VERSION_IMAGE: ghcr.io/${{ github.repository }}:${{ steps.image.outputs.version }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_BASE_DIGEST: ${{ needs.metadata.outputs.base_digest }}
          EXPECTED_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          latest_digest="$(docker buildx imagetools inspect "${IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          version_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          test "${latest_digest}" = "${EXPECTED_DIGEST}"
          test "${version_digest}" = "${EXPECTED_DIGEST}"

          manifest="$(docker buildx imagetools inspect "${VERSION_IMAGE}")"
          printf '%s\n' "${manifest}"
          grep -q 'Platform:[[:space:]]*linux/amd64' <<<"${manifest}"
          grep -q 'Platform:[[:space:]]*linux/arm64' <<<"${manifest}"

          for platform in linux/amd64 linux/arm64; do
            base_digest="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.base.digest\" }}")"
            version="$(docker buildx imagetools inspect "${VERSION_IMAGE}" \
              --format "{{ index (index .Image \"${platform}\").Config.Labels \"org.opencontainers.image.version\" }}")"
            test "${base_digest}" = "${EXPECTED_BASE_DIGEST}"
            test "${version}" = "${EXPECTED_VERSION}"
          done

          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .Provenance}}' > "${RUNNER_TEMP}/provenance.json"
          docker buildx imagetools inspect "${VERSION_IMAGE}" \
            --format '{{json .SBOM}}' > "${RUNNER_TEMP}/sbom.json"
          grep -q '"SLSA"' "${RUNNER_TEMP}/provenance.json"
          grep -q '"SPDX"' "${RUNNER_TEMP}/sbom.json"

      - name: Prune GHCR package versions (keep 10)
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-type: container
          package-name: ${{ github.event.repository.name }}
          min-versions-to-keep: 10
          delete-only-untagged-versions: "false"
