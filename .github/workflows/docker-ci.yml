name: Validate Docker image

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.36.0
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.32.0@sha256:1f8167fcb0eca5b7126353d35299386945cbb8949cc516c592a49f80cfce4fa2
  # renovate: datasource=docker depName=koalaman/shellcheck
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  # renovate: datasource=docker depName=ghcr.io/hadolint/hadolint
  HADOLINT_IMAGE: ghcr.io/hadolint/hadolint:v2.15.1-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          find root scripts -type f -print0 \
            | xargs -0 grep -IlZ '^#!' \
            | sort -z \
            | xargs -0 --no-run-if-empty docker run --rm \
                --volume "$PWD:/repo:ro" \
                --workdir /repo \
                "$SHELLCHECK_IMAGE"

      - name: Hadolint
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            "$HADOLINT_IMAGE" hadolint Dockerfile

  verify:
    name: Verify (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build and load image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          pull: true
          no-cache: true
          tags: docker-nginx:ci-${{ matrix.arch }}

      - name: Confirm loaded architecture
        shell: bash
        run: |
          set -euo pipefail
          actual="$(docker image inspect \
            --format '{{.Architecture}}' \
            docker-nginx:ci-${{ matrix.arch }})"
          test "${actual}" = "${{ matrix.arch }}"

      - name: Run core smoke test
        env:
          IMAGE: docker-nginx:ci-${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          SKIP_BUILD: "1"
        run: scripts/verify-image.sh

      - name: Run integration tests
        if: matrix.arch == 'amd64'
        env:
          IMAGE: docker-nginx:ci-amd64
        run: scripts/verify-integration.sh
